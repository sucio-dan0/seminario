<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explored | Registro</title>

    <link rel="stylesheet" href="css/registro.css">
</head>
<body>

<div class="contenedor">

    <h1>Crear Cuenta</h1>

    <p>Regístrate para consultar eventos musicales.</p>

    <form id="registroForm">

        <div class="campo">
            <label for="nombre"></label>
            <input
                type="text"
                id="nombre"
                placeholder="Ingresa tu nombre"
                required
            >
        </div>

        <div class="campo">
            <label for="correo"></label>
            <input
                type="email"
                id="correo"
                placeholder="Ingresa tu correo"
                required
            >
        </div>

        <div class="campo">
            <label for="password"></label>
            <input
                type="password"
                id="password"
                placeholder="Ingresa tu contraseña"
                required
            >
        </div>

        <button type="submit">
            Registrarse
        </button>

    </form>

    <p class="texto">
        ¿Ya tienes cuenta?
        <a href="index.html">Iniciar sesión</a>
    </p>

</div>

<script src="../js/registro.js"></script>

</body>
</html>
