<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explored | Pago</title>

<link rel="stylesheet" href="css/pago.css">

</head>

<body>

<div class="contenedor">

    <h1>Explored</h1>

    <h2>Confirmar compra</h2>


    <div class="resumen">

        <h3>Resumen del pedido</h3>

        <div class="dato">
            <strong>Evento:</strong>
            <span id="nombreEvento"></span>
        </div>

        <div class="dato">
            <strong>Boletos:</strong>
            <span id="cantidadBoletos">0</span>
        </div>

        <div class="dato">
            <strong>Precio por boleto:</strong>
            <span>$500 MXN</span>
        </div>

        <div class="dato total">
            <strong>Total:</strong>
            <span id="totalPagar">$0 MXN</span>
        </div>

    </div>


    <h3>Datos de pago</h3>


    <form id="formPago">

        <input 
        type="text"
        id="nombre"
        placeholder="Nombre del titular"
        required>


        <input 
        type="text"
        id="tarjeta"
        placeholder="Número de tarjeta"
        maxlength="16"
        required>


        <div class="fila">

            <input 
            type="text"
            id="fecha"
            placeholder="MM/AA"
            maxlength="5"
            required>


            <input 
            type="password"
            id="cvv"
            placeholder="CVV"
            maxlength="3"
            required>

        </div>


        <button type="submit">

            PAGAR

        </button>


    </form>


    <button 
    class="regresar"
    onclick="window.location.href='evento.html'">

        REGRESAR

    </button>


</div>



<script src="../js/pago.js"></script>


<script>

document.addEventListener("DOMContentLoaded",()=>{

const modo=localStorage.getItem("modoDaltonico");

if(modo){

document.body.classList.add(modo);

}

});

</script>


</body>

</html>
