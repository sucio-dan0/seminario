<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explored | Boleto</title>

<link rel="stylesheet" href="css/boleto.css">

</head>

<body>

<div class="boleto">


<form action="principal.html" method="get">

SALIR

</form>

<p>BOLETO DIGITAL</p>

<div class="imagen">

</div>

<h2 id="nombreEvento"></h2>


<p>
<strong>Lugar:</strong>
<span id="lugarEvento"></span>

</p>


<p>

<span id="cantidadBoletos"></span>

</div>



<div class="folio">

</div>


</div>


</div>



<script src="../js/boleto.js"></script>



<script>

document.addEventListener("DOMContentLoaded",()=>{

const modo=localStorage.getItem("modoDaltonico");

if(modo){

document.body.classList.add(modo);

}

});

</script>


</body>

</html>
